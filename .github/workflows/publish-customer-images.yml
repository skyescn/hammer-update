# PAT 首推会停在 private 且不关联仓库。GITHUB_TOKEN 在公开仓里碰一次包，
# 就会建成 public 并挂上本仓库；随后本机 PAT 再推正式 tag，客户才能免登录 pull。
name: publish-customer-images
on:
  workflow_dispatch:
    inputs:
      backend:
        description: "backend tag, e.g. v2.9.2"
        required: true
      gateway:
        description: "gateway tag, e.g. v3.2.0"
        required: true
      admin_chat:
        description: "admin_chat tag, e.g. v1.8.0"
        required: true
jobs:
  link-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login with GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Touch packages so they inherit public from this repo
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          docker pull alpine:3.20
          touch_pkg() {
            local name="$1" tag="$2"
            docker tag alpine:3.20 "ghcr.io/${OWNER}/${REPO}/${name}:${tag}-link"
            docker push "ghcr.io/${OWNER}/${REPO}/${name}:${tag}-link" || true
          }
          touch_pkg hammer-backend "${{ inputs.backend }}"
          touch_pkg hammer-gateway "${{ inputs.gateway }}"
          touch_pkg hammer-admin-chat "${{ inputs.admin_chat }}"
